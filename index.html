<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <h1>Welcome to Telegram Mini App</h1>
    <button id="send-message">Send Message to Telegram</button>

    <script>
        // Wait until the Telegram Web App is ready
        window.Telegram.WebApp.ready();

        // Example of sending a message to Telegram using the Web App SDK
        document.getElementById("send-message").addEventListener("click", () => {
            window.Telegram.WebApp.sendData("Hello from your Telegram Mini App!");
        });

        // Optionally, you can customize the appearance of your Mini App
        window.Telegram.WebApp.MainButton.setText("Click Me");
        window.Telegram.WebApp.MainButton.show();
    </script>
</body>
</html>
